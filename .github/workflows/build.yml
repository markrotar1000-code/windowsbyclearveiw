name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run test:icm
      - run: npm run test:icm-structure
      - run: npm run test:build-plan-state
      - run: npm run test:build-plan-integration
      - run: npm run test:production-hardening
      - run: npm run test:marketing-platform
      - run: npm run test:ask-security
      - run: npm run test:ask-pricing
      - run: npm run test:ask-handoff
      - run: npm run test:ask-logs
      - run: npm run test:command-center
      - run: npm run test:siding-work
      - run: npm run test:recent-fixes
      - run: npm run test:public-terminology
      - run: npm run test:supplier-list
      - run: npm run test:quote-dictation
      - run: npm run test:plan-extras
      - run: npm run test:dimensions
      - run: npm run test:measurement-handoff
      - run: npm run test:audio-capture
      - run: npm run test:feature-usage
      - run: npm run test:payment-history
      - run: npm run test:copilot
      - run: npm run test:copilot-snapshot
      - run: npm run test:ai-surfaces
      - run: npm run test:google-tools
      - run: npm run test:google-reviews
      - run: npm run test:analytics
      - run: npm run test:permit-leads
      - run: npm run test:mail-pilot
      - run: npm run test:supplier-permits
      - run: npm run test:estimate
      - run: npm run test:quote-to-job
      - run: npm run test:lead-links
      - run: npm run test:quote-follow-ups
      - run: npm run test:quote-signing
      - run: npm run test:quote-amounts
      - run: npm run test:quote-price-edit
      - run: npm run test:review-request
      - run: npm run test:visitor-errors
      - run: npm run test:load-failed
      - run: npm run test:find
      - run: npm run test:flow
      - run: npm run test:contact-links
      - run: npm run test:layout-guards
      - run: npm run test:duplicated-facts
